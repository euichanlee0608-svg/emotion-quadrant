<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>감정의 사분면 — 내 마음에 이름 붙이기</title>
<meta name="description" content="한국어 감정단어 434개(박인조·민경환, 2005)를 쾌-불쾌·활성화 두 축의 사분면에 놓고, 고를수록 좁혀 들어가며 지금 내 감정의 이름을 찾아가는 웹앱.">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<style>
:root{
  --ink:#4a4048; --ink-soft:#8b7f88; --ink-faint:#b6abb3;
  --cream:#fbf6f4; --card:#fffdfc;
  --q1:#ffe9c9; /* 좋음·심함  */
  --q2:#e6dcff; /* 안좋음·심함 */
  --q3:#d6ecff; /* 안좋음·약함 */
  --q4:#d5f2e3; /* 좋음·약함  */
  --line:#e9dfe4;
  --shadow:0 10px 30px rgba(150,120,140,.13), 0 2px 8px rgba(150,120,140,.08);
  --spring:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden}
body{
  font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo',sans-serif;
  background:var(--cream); color:var(--ink);
  word-break:keep-all; overflow-wrap:break-word;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
/* 배경 몽글 블롭 */
body::before,body::after{
  content:''; position:fixed; border-radius:50%; filter:blur(70px); opacity:.5; z-index:0; pointer-events:none;
}
body::before{width:46vw;height:46vw;background:#ffe0ee;top:-14vw;left:-12vw}
body::after{width:42vw;height:42vw;background:#dff0ff;bottom:-16vw;right:-12vw}

.wrap{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:32px 20px 56px}

/* ---------- 인트로 ---------- */
.intro{text-align:center;padding:36px 0 8px}
.intro h1{font-size:2.05rem;font-weight:800;letter-spacing:-.03em;line-height:1.3;margin-bottom:14px}
.intro h1 em{font-style:normal;background:linear-gradient(transparent 58%,#ffd9ea 58%);padding:0 3px}
.intro p{font-size:1rem;line-height:1.85;color:var(--ink-soft);max-width:470px;margin:0 auto 10px}
.intro .steps{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:26px 0 30px}
.step{background:var(--card);border-radius:20px;padding:14px 16px;box-shadow:var(--shadow);
  font-size:.86rem;line-height:1.6;color:var(--ink-soft);width:206px;text-align:left}
.step b{display:block;color:var(--ink);font-size:.92rem;margin-bottom:4px}
.step span{display:block}
.step i{font-style:normal;display:inline-block;width:22px;height:22px;border-radius:50%;
  background:#ffeaf3;color:#c76a97;font-size:.72rem;font-weight:700;text-align:center;line-height:22px;margin-bottom:7px}

.btn{
  border:0;cursor:pointer;font-family:inherit;font-weight:700;
  border-radius:999px;padding:15px 34px;font-size:1rem;color:#fff;
  background:linear-gradient(135deg,#ffa6c9,#c9a5f0);
  box-shadow:0 8px 22px rgba(201,165,240,.42);
  transition:transform .25s var(--spring), box-shadow .25s ease;
}
.btn:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 12px 28px rgba(201,165,240,.5)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.ghost{background:#fff;color:var(--ink-soft);box-shadow:var(--shadow);font-weight:600}
.btn.here{background:#fff;color:#c76a97;box-shadow:var(--shadow);font-weight:700}
.btn.here:hover{background:#fff6fa}
.btn.sm{padding:10px 20px;font-size:.86rem}

/* ---------- 지도 화면 ---------- */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.depth-pill{background:#fff;border-radius:999px;padding:7px 15px;font-size:.8rem;font-weight:700;
  color:#c76a97;box-shadow:var(--shadow);white-space:nowrap}
.trail{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:.8rem;color:var(--ink-faint);min-width:0}
.trail span{background:#fff;border-radius:999px;padding:6px 12px;box-shadow:0 2px 8px rgba(150,120,140,.1);color:var(--ink-soft);font-weight:600}
.trail b{color:var(--ink-faint);font-weight:400}
.spacer{flex:1}

.prompt{font-size:1.02rem;font-weight:700;line-height:1.6;margin-bottom:4px}
.prompt em{font-style:normal;color:#c76a97}
.sub{font-size:.84rem;color:var(--ink-soft);line-height:1.65;margin-bottom:10px}

/* 보드 */
/* 축 라벨은 이 여백 안에 놓인다 — 여백과 라벨 위치를 같은 변수로 묶어 어긋나지 않게 한다 */
.board-outer{position:relative;--padX:88px;--padY:54px;padding:var(--padY) var(--padX)}
.board{
  /* 세로를 납작하게 잡아야 뜻 카드까지 한 화면에 들어온다(≈900px 높이 기준) */
  position:relative;width:100%;aspect-ratio:1/.66;border-radius:34px;overflow:hidden;
  background:var(--card);box-shadow:var(--shadow);
}
.quad{position:absolute;width:50%;height:50%;opacity:.5}
.quad.tl{top:0;left:0;background:radial-gradient(circle at 70% 70%,var(--q2),transparent 78%)}
.quad.tr{top:0;right:0;background:radial-gradient(circle at 30% 70%,var(--q1),transparent 78%)}
.quad.bl{bottom:0;left:0;background:radial-gradient(circle at 70% 30%,var(--q3),transparent 78%)}
.quad.br{bottom:0;right:0;background:radial-gradient(circle at 30% 30%,var(--q4),transparent 78%)}
.axis{position:absolute;background:var(--line)}
.axis.h{left:5%;right:5%;top:50%;height:1.5px;transform:translateY(-50%)}
.axis.v{top:5%;bottom:5%;left:50%;width:1.5px;transform:translateX(-50%)}
.origin{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:10px;height:10px;border-radius:50%;background:#fff;border:2.5px solid #f0c8dc}
.origin-label{position:absolute;left:50%;top:50%;transform:translate(-50%,14px);
  font-size:.68rem;color:var(--ink-faint);white-space:nowrap;font-weight:600}

/* 축 라벨 */
/* 축 라벨 — 보드 위 파스텔 배경에서도 읽히도록 흰 pill + 진한 글자 */
/* z-index — .board 가 DOM 상 뒤에 오므로 이게 없으면 라벨이 보드에 가려져 잘린다 */
.axl{position:absolute;z-index:3;font-size:.82rem;font-weight:800;color:var(--ink);line-height:1.3;
  background:rgba(255,253,252,.95);border-radius:13px;padding:6px 11px;
  box-shadow:0 2px 10px rgba(150,120,140,.14)}
.axl small{display:block;font-size:.68rem;font-weight:600;color:var(--ink-soft);margin-top:2px}
.axl.left{left:var(--padX);top:50%;transform:translate(calc(-100% - 10px),-50%);width:calc(var(--padX) - 10px);text-align:right}
.axl.right{right:var(--padX);top:50%;transform:translate(calc(100% + 10px),-50%);width:calc(var(--padX) - 10px)}
.axl.top{top:var(--padY);left:50%;transform:translate(-50%,calc(-100% - 9px));white-space:nowrap;text-align:center}
.axl.bottom{bottom:var(--padY);left:50%;transform:translate(-50%,calc(100% + 9px));white-space:nowrap;text-align:center}

/* 단어 칩 */
.chip{
  position:absolute;transform:translate(-50%,-50%);
  background:#fff;border:0;cursor:pointer;font-family:inherit;font-weight:700;color:var(--ink);
  border-radius:999px;padding:9px 15px;white-space:nowrap;
  font-size:calc(var(--cb,.93rem) * var(--s,1)); /* --s = 원형성에 비례한 크기 */
  box-shadow:0 4px 14px rgba(150,120,140,.16);
  transition:transform .3s var(--spring), box-shadow .25s ease, background .25s ease;
  animation:pop .45s var(--spring) both, bob 5s ease-in-out infinite;
}
.chip:hover{background:#fff6fa;box-shadow:0 8px 22px rgba(199,106,151,.26);z-index:5}
.chip.on{background:linear-gradient(135deg,#ffa6c9,#c9a5f0);color:#fff;
  box-shadow:0 10px 26px rgba(201,165,240,.5);z-index:6}
@keyframes pop{from{opacity:0;transform:translate(-50%,-50%) scale(.5)}to{opacity:1}}
@keyframes bob{0%,100%{margin-top:0}50%{margin-top:-5px}}
.chip:hover,.chip.on{animation-play-state:running,paused}

/* 뜻 카드 (바텀시트) */
.sheet{
  background:var(--card);border-radius:28px;padding:22px 24px;box-shadow:var(--shadow);
  margin-top:6px;animation:rise .4s var(--spring) both;
}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.sheet h3{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;margin-bottom:7px}
.sheet .def{font-size:.97rem;line-height:1.75;color:var(--ink-soft);margin-bottom:6px}
.sheet .meta{font-size:.74rem;color:var(--ink-faint);line-height:1.7;margin-bottom:16px}
.sheet .acts{display:flex;gap:9px;flex-wrap:wrap}
.hint{text-align:center;font-size:.84rem;color:var(--ink-faint);padding:20px 0 4px;line-height:1.7}

/* ---------- 결과 ---------- */
.result{text-align:center;padding:8px 0}
.result .kick{font-size:.84rem;color:var(--ink-soft);margin-bottom:12px}
.final-word{
  display:inline-block;font-size:2.5rem;font-weight:800;letter-spacing:-.035em;
  background:linear-gradient(135deg,#ff9dc4,#b99af0);-webkit-background-clip:text;background-clip:text;color:transparent;
  margin-bottom:14px;padding:0 6px;
}
.result .def{font-size:1.06rem;line-height:1.8;color:var(--ink);max-width:420px;margin:0 auto 24px}
.card{background:var(--card);border-radius:26px;padding:22px 24px;box-shadow:var(--shadow);
  text-align:left;margin:0 auto 16px;max-width:520px}
.card h4{font-size:.78rem;font-weight:700;color:var(--ink-faint);letter-spacing:.04em;margin-bottom:12px}
.journey{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.journey span{background:#fdf2f7;border-radius:999px;padding:7px 13px;font-size:.86rem;font-weight:700;color:#b0618c}
.journey b{color:var(--ink-faint);font-weight:400;font-size:.8rem}
.coords{display:flex;gap:22px;flex-wrap:wrap}
.co{flex:1;min-width:130px}
.co .lab{font-size:.74rem;color:var(--ink-faint);margin-bottom:6px}
.co .val{font-size:1.16rem;font-weight:800;margin-bottom:7px}
.bar{height:7px;border-radius:999px;background:#f3eaef;overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#ffc2da,#c2a8ef)}
.result .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}

/* ---------- 푸터 ---------- */
footer{margin-top:44px;padding-top:24px;border-top:1px solid var(--line);
  font-size:.76rem;line-height:1.85;color:var(--ink-faint);text-align:center}
footer a{color:var(--ink-soft)}
footer .cite{max-width:560px;margin:0 auto 14px}
.backlink{display:inline-block;background:#fff;border-radius:999px;padding:10px 20px;
  font-size:.8rem;font-weight:700;color:var(--ink-soft);text-decoration:none;box-shadow:var(--shadow);margin-top:6px}
.backlink:hover{color:#c76a97}
footer.slim{margin-top:26px;padding-top:18px}
footer.slim p{max-width:520px;margin:0 auto 12px;font-size:.72rem}
.en{font-size:.72rem;color:var(--ink-faint);max-width:520px;margin:14px auto 0;line-height:1.7}

/* ---------- 반응형 ---------- */
@media (max-width:860px){
  .wrap{padding:22px 15px 44px}
  .intro h1{font-size:1.7rem}
  .step{width:100%;max-width:280px}
  /* 좁은 화면엔 좌우 여백을 둘 수 없어, 좌·하·우 라벨을 보드 아래 한 줄로 내린다 */
  .board-outer{--padX:10px;--padY:52px;padding-bottom:70px}
  .board{aspect-ratio:1/.9;border-radius:26px}
  .axl.left,.axl.right,.axl.bottom{top:auto;bottom:10px;width:auto;max-width:31%;padding:0;white-space:normal}
  .axl.left{left:12px;right:auto;transform:none;text-align:left}
  .axl.right{right:12px;left:auto;transform:none;text-align:right}
  .axl.bottom{left:50%;transform:translateX(-50%);text-align:center}
  .chip{padding:8px 12px;--cb:.88rem}
}
@media (max-width:640px){
  .wrap{padding:18px 12px 40px}
  /* 첫 화면에서 '시작하기'까지 스크롤 없이 보이도록 인트로를 납작하게 */
  .intro{padding:10px 0 4px}
  .intro h1{font-size:1.42rem;margin-bottom:10px}
  .intro p{font-size:.9rem;line-height:1.7}
  .intro .steps{gap:8px;margin:18px 0 22px}
  .step{width:100%;max-width:none;display:grid;grid-template-columns:24px 1fr;
    column-gap:11px;row-gap:1px;align-items:center;padding:11px 14px;border-radius:16px}
  .step i{grid-column:1;grid-row:1/3;align-self:center;margin-bottom:0}
  .step b{grid-column:2;grid-row:1;font-size:.87rem;margin-bottom:0}
  .step span{grid-column:2;grid-row:2;font-size:.79rem;line-height:1.45}
  /* padding 을 통째로 덮으면 --padY(라벨 기준)와 어긋나 라벨이 보드에 겹친다. 변수만 조정할 것 */
  .board-outer{--padX:4px;padding-bottom:52px}
  .board{border-radius:22px}
  .chip{padding:7px 11px;--cb:.82rem}
  .sheet{padding:18px 17px;border-radius:22px}
  .sheet h3{font-size:1.28rem}
  .sheet .acts .btn{flex:1;min-width:132px;padding:13px 14px;font-size:.9rem}
  .final-word{font-size:2rem}
  .card{padding:18px 17px;border-radius:20px}
  .axl{font-size:.7rem}
  .axl small{font-size:.6rem}
  .prompt{font-size:.95rem}
  /* iOS 입력 확대 방지 대비 (입력 요소 추가 시) */
  input,textarea,select{font-size:16px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="wrap"><div id="app"></div></div>

<script type="module" src="./app.js?v=1"></script>
<script>
/* 방문 알림 비콘 — GAS→텔레그램 릴레이 (메모리 reference-website-visit-beacon-pattern).
   ref에 'emomap|' 접두사로 사이트 구분. ?owner=1 접속 시 이 브라우저는 이후 알림 제외.
   file:// (로컬 헤드리스 검증)과 localhost는 전송 스킵. */
(function(){
  var WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbxWKySPAxWsYnoZ9zo7G2wUK2CusxPwjy1USt_DyCFmmIe_y2pu8lAKBluImAHXXKHv4A/exec';
  var SITE = 'emomap';
  try {
    if (location.search.indexOf('owner=1') !== -1) {
      localStorage.setItem('__is_owner__', '1');
    } else if (localStorage.getItem('__is_owner__') !== '1'
               && location.protocol !== 'file:'
               && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
      var img = new Image();
      img.src = WEBAPP_URL + '?ref=' + encodeURIComponent(SITE + '|' + (document.referrer || 'direct'));
    }
  } catch (e) {}
})();
</script>
</body>
</html>
